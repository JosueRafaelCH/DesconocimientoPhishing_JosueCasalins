<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Acceso - Alerta de Seguridad</title>
</head>
<body>
    <div id="content" class="card p-4 col-md-6 mx-auto">
        <h2 class="text-warning">Autenticación de Usuario</h2>
        <div th:if="${param.error}" class="alert alert-danger">
            Correo o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alert alert-info">
            Has cerrado sesión correctamente.
        </div>
        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="mb-3">
                <label class="form-label">Correo Institucional:</label>
                <input type="email" name="correo" class="form-control" placeholder="juan.perez@itm.edu.co" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña:</label>
                <input type="password" name="contrasena" class="form-control" placeholder="********" required />
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
        <a href="/register" class="text-decoration-none mt-3">¿No tienes cuenta? Regístrate</a>
    </div>
</body>
</html>
