<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Dashboard</title>
</head>
<body>
    <div id="content">
        <h2 class="text-warning">Panel Principal</h2>
        <p class="lead">Bienvenido al simulador de entrenamiento en ciberseguridad.</p>
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card p-4">
                    <h3>Test Diagnóstico</h3>
                    <p class="text-muted">Evalúa tu nivel actual de conocimiento.</p>
                    <a href="/test" class="btn btn-outline-primary">Realizar Test</a>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-4">
                    <h3>Simulaciones</h3>
                    <p class="text-muted">Gestiona tus escenarios de prueba.</p>
                    <a href="/simulacion" class="btn btn-outline-primary">Ver Bandeja</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
