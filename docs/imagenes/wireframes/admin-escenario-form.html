<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Crear / Editar Escenario</title>
<link rel="stylesheet" href="wireframe-style.css">
</head>
<body>
<div class="wireframe">
  <div class="header">
    <div class="logo">Simulador Phishing</div>
    <div class="user-badge">
      <span class="user-name">Admin</span>
      <div class="user-avatar"></div>
      <div class="theme-toggle"></div>
    </div>
  </div>
  <div class="content">
    <div class="sidebar">
      <div class="menu-item">
        <div class="menu-icon"></div>
        Panel
      </div>
      <div class="menu-item">
        <div class="menu-icon"></div>
        Usuarios
      </div>
      <div class="menu-item">
        <div class="menu-icon"></div>
        Preguntas
      </div>
      <div class="menu-item active">
        <div class="menu-icon"></div>
        Escenarios
      </div>
      <div class="menu-item">
        <div class="menu-icon"></div>
        Asignar
      </div>
      <div class="menu-item">
        <div class="menu-icon"></div>
        Campa&ntilde;as
      </div>
    </div>
    <div class="main">
      <h1>Crear / Editar Escenario</h1>
      <div class="subtitle">Complete los campos del formulario</div>

      <form class="form-wf">
        <div class="field">
          <label>T&iacute;tulo</label>
          <input type="text" placeholder="Nombre del escenario">
        </div>
        <div class="field">
          <label>Descripci&oacute;n</label>
          <textarea placeholder="Describa el escenario de phishing..."></textarea>
        </div>
        <div class="field">
          <label>Nivel de dificultad</label>
          <select>
            <option>B&aacute;sico</option>
            <option>Intermedio</option>
            <option>Avanzado</option>
          </select>
        </div>
        <div class="btn-row">
          <button class="btn-wf primary">Guardar</button>
          <button class="btn-wf">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
  <div class="footer">
    &copy; 2026 Corporaci&oacute;n Universitaria Remington &mdash; Simulador de Phishing
  </div>
</div>
</body>
</html>
