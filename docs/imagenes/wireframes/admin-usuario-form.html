<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Crear / Editar Usuario</title>
<link rel="stylesheet" href="wireframe-style.css">
</head>
<body>
<div class="wireframe">
  <div class="header">
    <div class="logo">Simulador Phishing</div>
    <div class="user-badge">
      <span class="user-name">Admin</span>
      <div class="user-avatar"></div>
      <div class="theme-toggle"></div>
    </div>
  </div>
  <div class="content">
    <div class="sidebar">
      <div class="menu-item">
        <div class="menu-icon"></div>
        Panel
      </div>
      <div class="menu-item active">
        <div class="menu-icon"></div>
        Usuarios
      </div>
      <div class="menu-item">
        <div class="menu-icon"></div>
        Preguntas
      </div>
      <div class="menu-item">
        <div class="menu-icon"></div>
        Escenarios
      </div>
      <div class="menu-item">
        <div class="menu-icon"></div>
        Asignar
      </div>
      <div class="menu-item">
        <div class="menu-icon"></div>
        Campa&ntilde;as
      </div>
    </div>
    <div class="main">
      <h1>Crear / Editar Usuario</h1>
      <div class="subtitle">Complete los campos del formulario</div>

      <form class="form-wf">
        <div class="field">
          <label>Nombre</label>
          <input type="text" placeholder="Nombre">
        </div>
        <div class="field">
          <label>Apellido</label>
          <input type="text" placeholder="Apellido">
        </div>
        <div class="field">
          <label>Correo</label>
          <input type="email" placeholder="correo@uniremington.edu.co">
        </div>
        <div class="field">
          <label>Contrase&ntilde;a</label>
          <input type="password" placeholder="********">
        </div>
        <div class="field">
          <label>Rol</label>
          <select>
            <option>Seleccione un rol</option>
            <option>Admin</option>
            <option>Docente</option>
            <option>Estudiante</option>
          </select>
        </div>
        <div class="field">
          <label>Estado</label>
          <select>
            <option>Activo</option>
            <option>Inactivo</option>
          </select>
        </div>
        <div class="field">
          <label>Estrato</label>
          <select>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
          </select>
        </div>
        <div class="field">
          <label>Docente Tutor</label>
          <select>
            <option>Seleccione un docente</option>
            <option>Mar&iacute;a Torres</option>
            <option>Pedro Ram&iacute;rez</option>
            <option>Ana L&oacute;pez</option>
          </select>
        </div>
        <div class="btn-row">
          <button class="btn-wf primary">Guardar</button>
          <button class="btn-wf">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
  <div class="footer">
    &copy; 2026 Corporaci&oacute;n Universitaria Remington &mdash; Simulador de Phishing
  </div>
</div>
</body>
</html>
