<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Panel de Administración</title>
</head>
<body>
    <div id="content">
        <h2 class="text-warning">Panel de Administración</h2>
        <p class="lead">Bienvenido al panel de control del sistema.</p>
        <div class="row mt-4">
            <div class="col-md-3 mb-3">
                <div class="card text-center p-4 bg-light">
                    <h3 th:text="${totalUsuarios}">0</h3>
                    <p class="text-muted">Usuarios</p>
                    <a href="/admin/usuarios" class="btn btn-outline-primary btn-sm">Gestionar</a>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center p-4 bg-light">
                    <h3 th:text="${totalPreguntas}">0</h3>
                    <p class="text-muted">Preguntas</p>
                    <a href="/admin/preguntas" class="btn btn-outline-primary btn-sm">Gestionar</a>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center p-4 bg-light">
                    <h3 th:text="${totalEscenarios}">0</h3>
                    <p class="text-muted">Escenarios</p>
                    <a href="/admin/escenarios" class="btn btn-outline-primary btn-sm">Gestionar</a>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center p-4 bg-light">
                    <h3 th:text="${totalTests}">0</h3>
                    <p class="text-muted">Tests Realizados</p>
                    <a href="/admin/asignar" class="btn btn-outline-primary btn-sm">Asignar</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
