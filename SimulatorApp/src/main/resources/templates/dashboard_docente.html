<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Panel Docente</title>
</head>
<body>
    <div id="content">
        <h2 class="text-warning">Panel del Docente</h2>
        <p class="lead">Bienvenido, <strong th:text="${docente.nombres + ' ' + docente.apellidos}">Docente</strong></p>
        <div class="row mt-4">
            <div class="col-md-4 mb-3">
                <div class="card text-center p-4 bg-light">
                    <h3 th:text="${totalEstudiantes}">0</h3>
                    <p class="text-muted">Estudiantes a Cargo</p>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card text-center p-4 bg-light">
                    <h3 th:text="${totalTests}">0</h3>
                    <p class="text-muted">Tests Realizados</p>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card text-center p-4 bg-light">
                    <h3 th:text="${promedioGlobal + '%'}">0%</h3>
                    <p class="text-muted">Promedio Global</p>
                </div>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-md-6">
                <div class="card p-4">
                    <h4>Mis Estudiantes</h4>
                    <p class="text-muted">Ver estadísticas detalladas por estudiante.</p>
                    <a href="/docente/estudiantes" class="btn btn-outline-primary">Ver Estudiantes</a>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-4">
                    <h4>Simulaciones</h4>
                    <p class="text-muted">Accede a la bandeja de simulaciones.</p>
                    <a href="/simulacion" class="btn btn-outline-primary">Ver Bandeja</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
