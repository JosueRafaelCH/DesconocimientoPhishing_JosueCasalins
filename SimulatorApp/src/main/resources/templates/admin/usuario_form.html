<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title th:text="${usuario.id == null} ? 'Nuevo Usuario' : 'Editar Usuario'"></title>
</head>
<body>
    <div id="content">
        <div class="page-header">
            <h2><i class="bi bi-person-plus"></i> <span th:text="${usuario.id == null} ? 'Nuevo Usuario' : 'Editar Usuario'"></span></h2>
        </div>

        <div class="auth-card">
            <div class="card-custom">
                <form th:action="${usuario.id == null} ? @{/admin/usuarios/guardar} : @{/admin/usuarios/actualizar}" method="post" class="form-custom">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" th:if="${usuario.id != null}" name="id" th:value="${usuario.id}" />

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombres</label>
                            <input type="text" name="nombres" class="form-control" th:value="${usuario.nombres}" required />
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Apellidos</label>
                            <input type="text" name="apellidos" class="form-control" th:value="${usuario.apellidos}" required />
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo</label>
                        <input type="email" name="correo" class="form-control" th:value="${usuario.correoInstitucional}" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña <span class="text-secondary small" th:if="${usuario.id != null}">(dejar vacío para mantener)</span></label>
                        <input type="password" name="contrasena" class="form-control" th:required="${usuario.id == null}" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <select name="idRol" class="form-control" required>
                            <option value="">Seleccione un rol</option>
                            <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nombreRol}"
                                    th:selected="${usuario.rol?.id == r.id}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Estado</label>
                        <select name="idEstado" class="form-control" required>
                            <option value="">Seleccione estado</option>
                            <option th:each="e : ${estados}" th:value="${e.id}" th:text="${e.nombreEstado}"
                                    th:selected="${usuario.estado?.id == e.id}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Estrato</label>
                        <select name="idEstrato" class="form-control">
                            <option value="0">Sin estrato</option>
                            <option th:each="e : ${estratos}" th:value="${e.id}" th:text="${e.descripcion}"
                                    th:selected="${usuario.estrato?.id == e.id}"></option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Docente Tutor <span class="text-secondary small">(solo para estudiantes)</span></label>
                        <select name="idDocenteTutor" class="form-control">
                            <option value="">Sin tutor</option>
                            <option th:each="d : ${docentes}" th:value="${d.id}" th:text="${d.nombres} + ' ' + ${d.apellidos}"
                                    th:selected="${usuario.docenteTutor?.id == d.id}"></option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-custom btn-custom-primary w-100">
                            <i class="bi bi-save"></i> Guardar
                        </button>
                        <a href="/admin/usuarios" class="btn btn-custom btn-custom-secondary w-100">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
