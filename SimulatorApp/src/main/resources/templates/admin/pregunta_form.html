<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title th:text="${pregunta.id == null} ? 'Nueva Pregunta' : 'Editar Pregunta'"></title>
</head>
<body>
    <div id="content">
        <div class="page-header">
            <h2><i class="bi bi-question-circle"></i> <span th:text="${pregunta.id == null} ? 'Nueva Pregunta' : 'Editar Pregunta'"></span></h2>
        </div>

        <div class="auth-card">
            <div class="card-custom">
                <form th:action="${pregunta.id == null} ? @{/admin/preguntas/guardar} : @{/admin/preguntas/actualizar}" method="post" class="form-custom">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" th:if="${pregunta.id != null}" name="id" th:value="${pregunta.id}" />

                    <div class="mb-3">
                        <label class="form-label">Enunciado</label>
                        <textarea name="enunciado" class="form-control" rows="3" required th:text="${pregunta.enunciado}"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nivel de Dificultad</label>
                        <select name="idNivel" class="form-control" required>
                            <option value="">Seleccione nivel</option>
                            <option th:each="n : ${niveles}" th:value="${n.id}" th:text="${n.nombreNivel}"
                                    th:selected="${pregunta.nivel?.id == n.id}"></option>
                        </select>
                    </div>

                    <hr>
                    <h6 class="fw-bold mb-3"><i class="bi bi-list-ul"></i> Opciones de Respuesta</h6>
                    <p class="small text-secondary mb-3">Seleccione la opción correcta (radio button).</p>

                    <div class="mb-3" th:each="i : ${#numbers.sequence(1, 4)}">
                        <label class="form-label" th:text="'Opción ' + ${i}"></label>
                        <div class="input-group">
                            <input type="radio" name="correcta" th:value="${i}"
                                   th:checked="${pregunta.id != null and pregunta.opciones.size() >= i and pregunta.opciones[i-1].esCorrecta}"
                                   class="input-group-text" style="width:40px;cursor:pointer;" />
                            <input type="text" th:name="'opcion_' + ${i}" class="form-control"
                                   th:value="${pregunta.id != null and pregunta.opciones.size() >= i} ? ${pregunta.opciones[i-1].textoOpcion} : ''"
                                   placeholder="Texto de la opción" required />
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-custom btn-custom-primary w-100">
                            <i class="bi bi-save"></i> Guardar
                        </button>
                        <a href="/admin/preguntas" class="btn btn-custom btn-custom-secondary w-100">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
