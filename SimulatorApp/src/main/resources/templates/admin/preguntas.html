<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Gestión de Preguntas</title>
</head>
<body>
    <div id="content">
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h2><i class="bi bi-question-circle-fill"></i> Preguntas</h2>
                <p>Banco de preguntas para las evaluaciones</p>
            </div>
            <a href="/admin/preguntas/nueva" class="btn btn-custom btn-custom-primary">
                <i class="bi bi-plus-circle"></i> Nueva Pregunta
            </a>
        </div>

        <div th:if="${mensaje}" class="alert-custom alert-custom-success mb-4" th:text="${mensaje}"></div>

        <div class="card-custom">
            <div class="table-responsive">
                <table class="table-custom">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Enunciado</th>
                            <th>Nivel</th>
                            <th>Opciones</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p, stat : ${preguntas}">
                            <td th:text="${stat.count}"></td>
                            <td th:text="${p.enunciado}"></td>
                            <td><span class="badge-custom badge-info" th:text="${p.nivel?.nombreNivel}"></span></td>
                            <td th:text="${#lists.size(p.opciones)}"></td>
                            <td>
                                <a th:href="@{/admin/preguntas/editar/{id}(id=${p.id})}"
                                   class="btn btn-custom btn-custom-sm btn-custom-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/admin/preguntas/eliminar/{id}(id=${p.id})}"
                                   class="btn btn-custom btn-custom-sm btn-custom-danger"
                                   onclick="return confirm('¿Eliminar esta pregunta?');">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3">
            <a href="/admin" class="btn btn-custom btn-custom-secondary">
                <i class="bi bi-arrow-left"></i> Volver al Panel
            </a>
        </div>
    </div>
</body>
</html>
