<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title th:text="${escenario.id == null} ? 'Nuevo Escenario' : 'Editar Escenario'"></title>
</head>
<body>
    <div id="content">
        <div class="page-header">
            <h2><i class="bi bi-diagram-3"></i> <span th:text="${escenario.id == null} ? 'Nuevo Escenario' : 'Editar Escenario'"></span></h2>
        </div>

        <div class="auth-card">
            <div class="card-custom">
                <form th:action="${escenario.id == null} ? @{/admin/escenarios/guardar} : @{/admin/escenarios/actualizar}" method="post" class="form-custom">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" th:if="${escenario.id != null}" name="id" th:value="${escenario.id}" />

                    <div class="mb-3">
                        <label class="form-label">Título</label>
                        <input type="text" name="titulo" class="form-control"
                               th:value="${escenario.titulo}" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="3" required th:text="${escenario.descripcion}"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nivel de Dificultad</label>
                        <select name="idNivel" class="form-control" required>
                            <option value="">Seleccione nivel</option>
                            <option th:each="n : ${niveles}" th:value="${n.id}" th:text="${n.nombreNivel}"
                                    th:selected="${escenario.nivel?.id == n.id}"></option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-custom btn-custom-primary w-100">
                            <i class="bi bi-save"></i> Guardar
                        </button>
                        <a href="/admin/escenarios" class="btn btn-custom btn-custom-secondary w-100">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
