<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Historial de Tests</title>
</head>
<body>
    <div id="content">
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h2><i class="bi bi-clock-history"></i> Historial de Tests</h2>
                <p>Revisa tus evaluaciones anteriores</p>
            </div>
            <a href="/test" class="btn btn-custom btn-custom-primary">
                <i class="bi bi-plus-circle"></i> Nuevo Test
            </a>
        </div>

        <div th:if="${#lists.isEmpty(tests)}" class="empty-state">
            <div class="empty-icon">&#x1f4ad;</div>
            <p>Aún no has realizado ningún test. ¡Empieza ahora!</p>
            <a href="/test" class="btn btn-custom btn-custom-primary mt-2">
                <i class="bi bi-play-fill"></i> Realizar primer test
            </a>
        </div>

        <div th:unless="${#lists.isEmpty(tests)}">
            <div class="card-custom">
                <div class="table-responsive">
                    <table class="table-custom">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Fecha</th>
                                <th>Nivel</th>
                                <th>Preguntas</th>
                                <th>Aciertos</th>
                                <th>Calificación</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="t, stat : ${tests}">
                                <td th:text="${stat.count}"></td>
                                <td th:text="${#temporals.format(t.fechaRealizacion, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <span class="badge-custom badge-info" th:text="${t.nivel?.nombreNivel ?: 'General'}"></span>
                                </td>
                                <td th:text="${t.cantidadPreguntas}">0</td>
                                <td th:text="${t.cantAciertos}">0</td>
                                <td>
                                    <span th:classappend="${t.calificacion != null and t.calificacion >= 3.0} ? 'badge-custom badge-success' : 'badge-custom badge-danger'"
                                          th:text="${#numbers.formatDecimal(t.calificacion, 0, 1)} + ' / 5.0'">
                                    </span>
                                </td>
                                <td>
                                    <a th:href="@{/test/resultados/{testId}(testId=${t.id})}"
                                       class="btn btn-custom btn-custom-sm btn-custom-primary">
                                        <i class="bi bi-eye"></i> Ver
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a href="/dashboard" class="btn btn-custom btn-custom-secondary">
                <i class="bi bi-arrow-left"></i> Volver al Panel
            </a>
        </div>
    </div>
</body>
</html>
