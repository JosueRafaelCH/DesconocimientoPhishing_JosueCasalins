<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Responder Test</title>
</head>
<body>
    <div id="content">
        <div class="page-header">
            <h2><i class="bi bi-pencil-square"></i> Responder Test</h2>
            <p><span class="badge-custom badge-info" th:text="'Dificultad: ' + ${nivelNombre}"></span></p>
        </div>

        <form th:action="@{/test/enviar/{testId}(testId=${test.id})}" method="post" class="form-custom">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="mb-4" th:each="pregunta, stat : ${preguntas}">
                <div class="card-custom mb-3">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h6 class="fw-bold mb-0" style="color:var(--accent);font-size:0.9rem;">
                                Pregunta <span th:text="${stat.count}"></span>
                            </h6>
                            <span class="badge-custom badge-info" th:text="${pregunta.nivel?.nombreNivel}"></span>
                        </div>
                        <p class="mb-3" th:text="${pregunta.enunciado}"></p>

                        <div class="mb-2" th:each="opcion : ${pregunta.opciones}">
                            <div class="form-check">
                                <input class="form-check-input" type="radio"
                                       th:name="'pregunta_' + ${pregunta.id}"
                                       th:id="'opcion_' + ${opcion.id}"
                                       th:value="${opcion.id}"
                                       style="border-color:var(--accent);" />
                                <label class="form-check-label" th:for="'opcion_' + ${opcion.id}" th:text="${opcion.textoOpcion}"></label>
                            </div>
                        </div>
                        <input type="hidden" th:name="'preguntaId_' + ${pregunta.id}" th:value="${pregunta.id}" />
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-custom btn-custom-success btn-lg">
                    <i class="bi bi-check2-circle"></i> Enviar Respuestas
                </button>
                <a href="/test" class="btn btn-custom btn-custom-secondary btn-lg">
                    <i class="bi bi-x-circle"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</body>
</html>
