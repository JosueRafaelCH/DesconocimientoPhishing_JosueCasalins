<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Gestión de Escenarios</title>
</head>
<body>
    <div id="content" class="card p-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="text-warning">Escenarios de Phishing</h2>
            <a href="/admin/escenarios/nuevo" class="btn btn-success">+ Nuevo Escenario</a>
        </div>
        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Descripción</th>
                    <th>Nivel</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="e : ${escenarios}">
                    <td th:text="${e.id}">1</td>
                    <td th:text="${e.titulo}">Título</td>
                    <td th:text="${e.descripcion}">Descripción</td>
                    <td th:text="${e.nivel.nombreNivel}">Nivel</td>
                    <td>
                        <form th:action="@{/admin/escenarios/eliminar/{id}(id=${e.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar este escenario?')">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <a href="/admin" class="btn btn-secondary">Volver</a>
    </div>
</body>
</html>
