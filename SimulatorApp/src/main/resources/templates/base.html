<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} + ' | Simulador Institucional'">Simulador de Phishing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-dark mb-5">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand" href="/">🛡️ Centro de Concientización en Ciberseguridad</a>
            <div sec:authorize="isAuthenticated()" class="text-light">
                <span class="me-3">Usuario: <strong sec:authentication="name"></strong></span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
                </form>
            </div>
        </div>
    </nav>
    <div class="container">
        <div th:replace="${content}"></div>
    </div>
    <footer class="mt-5 text-center text-muted">
        <p>&copy; 2026 - Departamento de Seguridad Digital</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
