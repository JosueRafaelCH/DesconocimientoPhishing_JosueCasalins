<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Simulador de Phishing · Uniremington'">Simulador de Phishing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">
                <span class="brand-icon">&#x1f6e1;&#xfe0f;</span>
                Simulador de phishing · Corporación Universitaria Remington
            </a>
            <div class="d-flex align-items-center gap-2">
                <button id="themeToggle" class="theme-toggle" title="Cambiar tema">
                    <i class="bi bi-moon-fill"></i>
                </button>
                <div sec:authorize="isAuthenticated()" class="nav-info d-none d-md-flex align-items-center gap-3">
                    <span>
                        <i class="bi bi-person-circle"></i>
                        <strong sec:authentication="name"></strong>
                    </span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-custom btn-custom-sm" style="background:rgba(255,255,255,0.1);color:var(--text-navbar);border:1px solid rgba(255,255,255,0.15);">
                            <i class="bi bi-box-arrow-right"></i> Salir
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div th:replace="${content}"></div>
    </div>

    <footer class="footer-custom">
        <div class="container">
            <p class="mb-0">&copy; 2026 — Simulador de phishing · Corporación Universitaria Remington</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
