<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Test Diagnóstico</title>
</head>
<body>
    <div id="content" class="card p-4">
        <h2 class="text-warning">Test Diagnóstico</h2>
        <p class="text-muted">Responde las siguientes preguntas para evaluar tu conocimiento.</p>
        <form th:action="@{/test/submit}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div th:each="pregunta, iterStat : ${preguntas}" class="mb-4 p-3 border rounded">
                <p class="fw-bold" th:text="${'Pregunta ' + (iterStat.index + 1) + ': ' + pregunta.enunciado}">Pregunta?</p>
                <div th:each="opcion : ${pregunta.opciones}" class="form-check">
                    <input type="radio" th:name="'respuestas[' + ${iterStat.index} + ']'" th:value="${opcion.id}" class="form-check-input" required />
                    <label class="form-check-label" th:text="${opcion.textoOpcion}">Opcion</label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Enviar Test</button>
            <a href="/dashboard" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
