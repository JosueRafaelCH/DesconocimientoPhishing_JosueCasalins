<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Resultados del Test</title>
</head>
<body>
    <div id="content" class="card p-4">
        <h2 class="text-warning">Resultados del Test</h2>
        <p>Realizado el: <strong th:text="${test.fechaRealizacion}">2026-01-01</strong></p>
        <div class="row mt-3">
            <div class="col-md-4">
                <div class="card text-center p-3 bg-light">
                    <h3 th:text="${total}">0</h3>
                    <p class="text-muted">Total Preguntas</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center p-3 bg-success text-white">
                    <h3 th:text="${correctas}">0</h3>
                    <p>Correctas</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center p-3" th:classappend="${porcentaje >= 60} ? 'bg-success text-white' : 'bg-danger text-white'">
                    <h3 th:text="${porcentaje + '%'}">0%</h3>
                    <p>Puntaje</p>
                </div>
            </div>
        </div>
        <h3 class="mt-4">Detalle</h3>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Pregunta</th>
                    <th>Tu Respuesta</th>
                    <th>Resultado</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="respuesta : ${respuestas}">
                    <td th:text="${respuesta.pregunta.enunciado}">Pregunta</td>
                    <td th:text="${respuesta.opcion.textoOpcion}">Respuesta</td>
                    <td>
                        <span th:if="${respuesta.opcion.esCorrecta}" class="text-success">Correcta</span>
                        <span th:unless="${respuesta.opcion.esCorrecta}" class="text-danger">Incorrecta</span>
                    </td>
                </tr>
            </tbody>
        </table>
        <a href="/test/historial" class="btn btn-secondary">Volver al Historial</a>
    </div>
</body>
</html>
