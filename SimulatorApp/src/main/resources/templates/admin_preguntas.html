<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Gestión de Preguntas</title>
</head>
<body>
    <div id="content" class="card p-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="text-warning">Preguntas</h2>
            <a href="/admin/preguntas/nueva" class="btn btn-success">+ Nueva Pregunta</a>
        </div>
        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Enunciado</th>
                    <th>Nivel</th>
                    <th>Opciones</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${preguntas}">
                    <td th:text="${p.id}">1</td>
                    <td th:text="${p.enunciado}">Enunciado</td>
                    <td th:text="${p.nivel.nombreNivel}">Nivel</td>
                    <td th:text="${p.opciones.size()}">0</td>
                    <td>
                        <form th:action="@{/admin/preguntas/eliminar/{id}(id=${p.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar esta pregunta?')">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <a href="/admin" class="btn btn-secondary">Volver</a>
    </div>
</body>
</html>
