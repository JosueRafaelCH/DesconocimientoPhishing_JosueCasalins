<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Nueva Pregunta</title>
</head>
<body>
    <div id="content" class="card p-4 col-md-8 mx-auto">
        <h2 class="text-warning">Nueva Pregunta</h2>
        <form th:action="@{/admin/preguntas/guardar}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="mb-3">
                <label class="form-label">Enunciado:</label>
                <textarea name="enunciado" class="form-control" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Nivel de Dificultad:</label>
                <select name="idNivel" class="form-control" required>
                    <option th:each="n : ${niveles}" th:value="${n.id}" th:text="${n.nombreNivel}"></option>
                </select>
            </div>
            <h4>Opciones</h4>
            <div class="mb-2" th:each="i : ${#numbers.sequence(1, 4)}">
                <div class="input-group">
                    <input type="text" th:name="'opcionTexto'" class="form-control" th:placeholder="'Opción ' + ${i}" required />
                    <div class="input-group-text">
                        <input type="radio" name="opcionCorrecta" th:value="${i - 1}" required />
                        <label class="ms-1">Correcta</label>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Guardar Pregunta</button>
            <a href="/admin/preguntas" class="btn btn-secondary mt-3">Cancelar</a>
        </form>
    </div>
</body>
</html>
