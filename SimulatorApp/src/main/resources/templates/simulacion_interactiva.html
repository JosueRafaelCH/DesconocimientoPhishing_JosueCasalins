<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Simulación Interactiva</title>
</head>
<body>
    <div id="content">
        <div class="card p-4 mb-4">
            <h2 class="text-warning" th:text="${evento.escenario.titulo}">Escenario</h2>
            <p th:text="${evento.escenario.descripcion}">Descripción del escenario...</p>
            <p class="text-muted">Estado: <strong th:text="${evento.estadoEvento.nombreEstado}">Activo</strong></p>
            <p class="text-muted">Nivel: <strong th:text="${evento.escenario.nivel.nombreNivel}">Básico</strong></p>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <div class="card p-4 text-center">
                    <h5>¿Has hecho clic en el enlace?</h5>
                    <form th:action="@{/simulacion/{id}/clic(id=${evento.id})}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-warning mt-2"
                            th:disabled="${interaccion?.fechaClic != null}">
                            <span th:if="${interaccion?.fechaClic == null}">Simular Clic</span>
                            <span th:unless="${interaccion?.fechaClic == null}">Clic Registrado</span>
                        </button>
                    </form>
                    <p th:if="${interaccion?.fechaClic != null}" class="text-muted mt-2">
                        Clic registrado el <span th:text="${interaccion.fechaClic}"></span>
                    </p>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card p-4 text-center">
                    <h5>¿Ingresaste tus datos?</h5>
                    <form th:action="@{/simulacion/{id}/datos(id=${evento.id})}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-danger mt-2"
                            th:disabled="${interaccion?.fechaDatosIngresados != null}">
                            <span th:if="${interaccion?.fechaDatosIngresados == null}">Simular Ingreso de Datos</span>
                            <span th:unless="${interaccion?.fechaDatosIngresados == null}">Datos Ingresados</span>
                        </button>
                    </form>
                    <p th:if="${interaccion?.fechaDatosIngresados != null}" class="text-muted mt-2">
                        Datos ingresados el <span th:text="${interaccion.fechaDatosIngresados}"></span>
                    </p>
                </div>
            </div>
        </div>

        <div th:if="${feedbacks != null and !feedbacks.empty}" class="card p-4 mt-3">
            <h4>Feedback</h4>
            <div th:each="fb : ${feedbacks}" class="alert alert-info">
                <p th:text="${fb.contenidoFeedback}">Feedback content</p>
                <small class="text-muted" th:text="${'Generado el: ' + fb.fechaGeneracion + ' por ' + fb.modeloIa}">Fecha</small>
            </div>
        </div>

        <a href="/simulacion" class="btn btn-secondary mt-3">Volver a Simulaciones</a>
    </div>
</body>
</html>
