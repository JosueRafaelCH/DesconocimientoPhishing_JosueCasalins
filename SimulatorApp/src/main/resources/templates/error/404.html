<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Página No Encontrada</title>
</head>
<body>
    <div id="content" class="auth-card">
        <div class="card-custom text-center">
            <span style="font-size:4rem;">&#x1f50d;</span>
            <h2>Página No Encontrada</h2>
            <p class="auth-subtitle">La página que buscas no existe o ha sido movida.</p>
            <p class="text-muted" style="font-size:0.9rem;" th:if="${error}">
                <i class="bi bi-info-circle"></i> <span th:text="${error}"></span>
            </p>
            <a href="/dashboard" class="btn btn-custom btn-custom-primary mt-3">
                <i class="bi bi-house-fill"></i> Volver al inicio
            </a>
        </div>
    </div>
</body>
</html>
