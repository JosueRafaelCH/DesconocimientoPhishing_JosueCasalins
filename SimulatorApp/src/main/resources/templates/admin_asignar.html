<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Asignar Simulación</title>
</head>
<body>
    <div id="content" class="card p-4 col-md-8 mx-auto">
        <h2 class="text-warning">Asignar Simulación a Usuario</h2>
        <form th:action="@{/admin/asignar/guardar}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="mb-3">
                <label class="form-label">Usuario:</label>
                <select name="idUsuario" class="form-control" required>
                    <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombres + ' ' + u.apellidos + ' (' + u.correoInstitucional + ')'}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Escenario:</label>
                <select name="idEscenario" class="form-control" required>
                    <option th:each="e : ${escenarios}" th:value="${e.id}" th:text="${e.titulo}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Estado Inicial:</label>
                <select name="idEstadoEvento" class="form-control" required>
                    <option th:each="ee : ${estadosEvento}" th:value="${ee.id}" th:text="${ee.nombreEstado}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Asignar</button>
            <a href="/admin" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
