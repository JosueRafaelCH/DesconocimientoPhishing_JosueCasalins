<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Mis Estudiantes</title>
</head>
<body>
    <div id="content">
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h2><i class="bi bi-people-fill"></i> Mis Estudiantes</h2>
                <p>Estudiantes bajo tu tutoría</p>
            </div>
            <span class="badge-custom badge-info" th:text="${#lists.size(stats)} + ' estudiantes'"></span>
        </div>

        <div th:if="${#lists.isEmpty(stats)}" class="empty-state">
            <div class="empty-icon">&#x1f465;</div>
            <p>No tienes estudiantes asignados actualmente.</p>
        </div>

        <div th:unless="${#lists.isEmpty(stats)}">
            <div class="card-custom">
                <div class="table-responsive">
                    <table class="table-custom">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Estrato</th>
                                <th>Tests</th>
                                <th>Promedio</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${stats}">
                                <td th:text="${s.estudiante?.nombres} + ' ' + ${s.estudiante?.apellidos}"></td>
                                <td th:text="${s.estudiante?.correoInstitucional}"></td>
                                <td th:text="${s.estudiante?.estrato?.descripcion ?: '---'}"></td>
                                <td><span class="badge-custom badge-info" th:text="${s.totalTests}"></span></td>
                                <td>
                                    <span th:text="${s.promedio}"></span>
                                </td>
                                <td>
                                    <a th:href="@{/docente/estudiante/{id}(id=${s.estudiante?.id})}"
                                       class="btn btn-custom btn-custom-sm btn-custom-primary">
                                        <i class="bi bi-eye"></i> Ver detalle
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a href="/docente/panel" class="btn btn-custom btn-custom-secondary">
                <i class="bi bi-arrow-left"></i> Volver al Panel
            </a>
        </div>
    </div>
</body>
</html>
