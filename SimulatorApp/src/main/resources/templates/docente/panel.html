<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Panel Docente</title>
</head>
<body>
    <div id="content">
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h2><i class="bi bi-mortarboard-fill"></i> Panel Docente</h2>
                <p>Bienvenido, <strong th:text="${session.usuario?.nombres}">Docente</strong>. Gestiona el progreso de tus estudiantes.</p>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-4 col-6">
                <div class="stat-card">
                    <div class="stat-number" th:text="${totalEstudiantes}">0</div>
                    <div class="stat-label"><i class="bi bi-people-fill"></i> Estudiantes</div>
                </div>
            </div>
            <div class="col-md-4 col-6">
                <div class="stat-card success">
                    <div class="stat-number" th:text="${totalTests}">0</div>
                    <div class="stat-label"><i class="bi bi-file-text"></i> Tests Realizados</div>
                </div>
            </div>
            <div class="col-md-4 col-6">
                <div class="stat-card warning">
                    <div class="stat-number" th:text="${#numbers.formatDecimal(promedioGlobal, 0, 1)}">0.0</div>
                    <div class="stat-label"><i class="bi bi-star-fill"></i> Promedio General</div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <a href="/docente/estudiantes" class="menu-card">
                    <span class="menu-icon">&#x1f465;</span>
                    <h5>Mis Estudiantes</h5>
                    <p>Ver lista de estudiantes y sus estadísticas individuales</p>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
