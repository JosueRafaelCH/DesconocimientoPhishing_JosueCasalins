<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Nuevo Escenario</title>
</head>
<body>
    <div id="content" class="card p-4 col-md-8 mx-auto">
        <h2 class="text-warning">Nuevo Escenario de Phishing</h2>
        <form th:action="@{/admin/escenarios/guardar}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="mb-3">
                <label class="form-label">Título:</label>
                <input type="text" name="titulo" class="form-control" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción:</label>
                <textarea name="descripcion" class="form-control" rows="4" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Nivel de Dificultad:</label>
                <select name="idNivel" class="form-control" required>
                    <option th:each="n : ${niveles}" th:value="${n.id}" th:text="${n.nombreNivel}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Guardar Escenario</button>
            <a href="/admin/escenarios" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
