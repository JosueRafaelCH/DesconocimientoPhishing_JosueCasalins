<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Gestión de Usuarios</title>
</head>
<body>
    <div id="content" class="card p-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="text-warning">Usuarios</h2>
            <a href="/admin/usuarios/nuevo" class="btn btn-success">+ Nuevo Usuario</a>
        </div>
        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombres</th>
                    <th>Apellidos</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Estrato</th>
                    <th>Tutor</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.id}">1</td>
                    <td th:text="${u.nombres}">Nombres</td>
                    <td th:text="${u.apellidos}">Apellidos</td>
                    <td th:text="${u.correoInstitucional}">correo@itm.edu.co</td>
                    <td th:text="${u.rol.nombreRol}">Rol</td>
                    <td th:text="${u.estado.nombreEstado}">Estado</td>
                    <td th:text="${u.estrato.descripcion}">Estrato</td>
                    <td th:text="${u.docenteTutor?.nombres + ' ' + u.docenteTutor?.apellidos ?: '—'}">Tutor</td>
                    <td>
                        <a th:href="@{/admin/usuarios/editar/{id}(id=${u.id})}" class="btn btn-sm btn-primary">Editar</a>
                        <form th:action="@{/admin/usuarios/eliminar/{id}(id=${u.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar este usuario?')">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <a href="/admin" class="btn btn-secondary">Volver</a>
    </div>
</body>
</html>
