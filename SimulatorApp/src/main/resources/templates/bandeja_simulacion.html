<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Bandeja de Simulaciones</title>
</head>
<body>
    <div id="content" class="card p-4">
        <h2 class="text-warning">Bandeja de Simulaciones</h2>
        <div th:if="${eventos.empty}" class="alert alert-info">No tienes simulaciones asignadas actualmente.</div>
        <table th:unless="${eventos.empty}" class="table table-striped">
            <thead>
                <tr>
                    <th>Escenario</th>
                    <th>Estado</th>
                    <th>Fecha Envío</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="evento : ${eventos}">
                    <td th:text="${evento.escenario.titulo}">Escenario</td>
                    <td th:text="${evento.estadoEvento.nombreEstado}">Estado</td>
                    <td th:text="${evento.fechaEnvio}">2026-01-01</td>
                    <td><a th:href="@{/simulacion/{id}/interactuar(id=${evento.id})}" class="btn btn-sm btn-outline-primary">Interactuar</a></td>
                </tr>
            </tbody>
        </table>
        <a href="/dashboard" class="btn btn-secondary mt-3">Volver al Dashboard</a>
    </div>
</body>
</html>
